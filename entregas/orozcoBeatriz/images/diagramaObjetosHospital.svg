xt fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="477" x="741" y="317.3613">columnas = "id_paciente PK, nombre NN, apellidos NN, fecha_nac, alergias"</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="264" x="741" y="334.9707">reglas = "CHECK fecha_nac &lt;= TODAY()"</text></g><g id="elem_TablaPac"><rect fill="#F1F1F1" height="64.8281" style="stroke:#181818;stroke-width:0.5;" width="423" x="374" y="401.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="154" x="508.5" y="418.1426">Tabla_Pacientes : Tabla</text><line style="stroke:#181818;stroke-width:0.5;" x1="375" x2="796" y1="423.2188" y2="423.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="411" x="380" y="441.752">columnas = "id_paciente, nombre, apellidos, fecha_nac, alergias"</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="365" x="380" y="459.3613">registro = "[2001, 'Ana', 'Perez', '1990-04-12', 'Penicilina']"</text></g><g id="elem_QryPac"><rect fill="#F1F1F1" height="47.2188" style="stroke:#181818;stroke-width:0.5;" width="429" x="7" y="277.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="224" x="109.5" y="293.6426">Consulta_Ver_Pacientes : Consulta</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="435" y1="298.7188" y2="298.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="417" x="13" y="317.252">sql = "SELECT * FROM Tabla_Pacientes WHERE id_paciente = ?"</text></g><g id="elem_RolMed"><rect fill="#F1F1F1" height="47.2188" style="stroke:#181818;stroke-width:0.5;" width="131" x="398" y="152.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107" x="410" y="169.1426">Rol_Medico : Rol</text><l